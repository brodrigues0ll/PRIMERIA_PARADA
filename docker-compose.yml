services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - MONGODB_URI=${MONGODB_URI}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - TZ=America/Sao_Paulo
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - MONGODB_URI=${MONGODB_URI}
      - FRONTEND_URL=${NEXTAUTH_URL}
      - MINIO_ENDPOINT_HOST=minio
      - MINIO_ENDPOINT_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET=${MINIO_BUCKET:-produtos}
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL}
      - TZ=America/Sao_Paulo
    depends_on:
      - minio
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
    volumes:
      - minio_data:/data
    restart: unless-stopped

  cron:
    image: alpine:3.19
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache wget > /dev/null 2>&1 &&
          while true; do
            wget -qO- \"http://frontend:3000/api/whatsapp/auto-reset?key=$${CRON_SECRET}\" > /dev/null 2>&1 || true;
            sleep 60;
          done"
    environment:
      - CRON_SECRET=${CRON_SECRET:-primeria-cron-secret}
      - TZ=America/Sao_Paulo
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  minio_data:
