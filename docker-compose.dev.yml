services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    image: primeira-parada-frontend-dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file: .env.local
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    image: primeira-parada-backend-dev
    command: npm run dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: .env.local
    environment:
      - PORT=4000
      - TZ=America/Sao_Paulo
    depends_on:
      - minio
    restart: unless-stopped

  whatsapp:
    build:
      context: ./OpenWA
      dockerfile: Dockerfile
    image: primeira-parada-openwa-dev
    container_name: primeira-parada-openwa
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: 2048
    mem_limit: 2g
    ports:
      - "3099:2785"
    env_file: .env.local
    environment:
      - NODE_ENV=development
      - PORT=2785
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - TZ=America/Sao_Paulo
    volumes:
      - ./OpenWA/data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2785/api/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env_file: .env.local
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - minio_data:/data
    restart: unless-stopped

  cron:
    image: alpine:3.19
    entrypoint: /bin/sh
    command: >
      -c "apk add --no-cache wget > /dev/null 2>&1 &&
          while true; do
            wget -qO- \"http://frontend:3000/api/whatsapp/auto-reset?key=$${CRON_SECRET}\" > /dev/null 2>&1 || true;
            sleep 60;
          done"
    env_file: .env.local
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  minio_data:
