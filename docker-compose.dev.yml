services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    image: primeira-parada-frontend-dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file: .env.local
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      - backend
      - whatsapp
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    image: primeira-parada-backend-dev
    command: npm run dev
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: .env.local
    environment:
      - PORT=4000
      - TZ=America/Sao_Paulo
    depends_on:
      - minio
    restart: unless-stopped

  whatsapp:
    build:
      context: ./whatsapp
      dockerfile: Dockerfile
      target: deps
    image: primeira-parada-whatsapp-dev
    command: node src/index.js
    ports:
      - "3099:3099"
    volumes:
      - ./whatsapp/src:/app/src
      - ./whatsapp/auth:/app/auth
      - ./whatsapp/store.json:/app/store.json
    env_file: .env.local
    environment:
      - PORT=3099
      - TZ=America/Sao_Paulo
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: America/Sao_Paulo
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  minio_data:
